<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadBound · ארבעה אתרים</title>
<link rel="icon" href="../assets/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #06090D; --ink: #EAF0F3; --soft: #9AABB6; --acc: #12B7D4; --line: rgb(234 240 243 / 0.14); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 "IBM Plex Sans Hebrew", system-ui, sans-serif; }
  header { padding: 44px clamp(16px, 4vw, 56px) 4px; max-width: 1840px; margin: auto; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem); letter-spacing: -0.02em; }
  header p { margin: 10px 0 0; color: var(--soft); max-width: 64ch; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding: 28px clamp(16px, 4vw, 56px) 40px; max-width: 1840px; margin: auto; }
  @media (max-width: 1500px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  figure { margin: 0; display: flex; flex-direction: column; }
  .frame { position: relative; aspect-ratio: 9 / 13; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #000; }
  iframe { position: absolute; inset: 0; width: 1440px; height: 2080px; border: 0; transform-origin: top right; }
  figcaption { padding: 14px 2px 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  figcaption b { font-weight: 600; font-size: 1.15rem; }
  figcaption p { margin: 6px 0 0; color: var(--soft); font-size: 0.95rem; }
  figcaption a { color: var(--acc); font: 500 0.85rem/1 "IBM Plex Mono", monospace; white-space: nowrap; }
  .num { font: 500 0.85rem/1 "IBM Plex Mono", monospace; color: var(--acc); margin-inline-end: 8px; }
  footer { max-width: 1840px; margin: auto; padding: 0 clamp(16px, 4vw, 56px) 56px; color: var(--soft); font-size: 0.92rem; }
  footer a { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>ארבעה אתרים מלאים. בוחרים אחד.</h1>
  <p>אותו תוכן מהאתר של LeadBound, ארבעה כיוונים שונים. התצוגה כאן מוקטנת: כדאי לפתוח כל אחד במסך מלא ולגלול אותו עד הסוף, גם בטלפון.</p>
</header>
<main class="grid">
  <figure><div class="frame"><iframe src="a-editorial/" title="אתר A" loading="lazy"></iframe></div>
    <figcaption><div class="row"><div><span class="num">A</span><b>המטרה</b></div><a href="a-editorial/" target="_blank">מסך מלא</a></div>
    <p>נייר בהיר, טיפוגרפיה ענקית, והמטרה מהלוגו כאובייקט תלת-ממדי שעובר לאורך הדף. חיצים פוגעים בה שלב אחרי שלב, עד המרכז.</p></figcaption></figure>
  <figure><div class="frame"><iframe src="b-machine/" title="אתר B" loading="lazy"></iframe></div>
    <figcaption><div class="row"><div><span class="num">B</span><b>המכונה</b></div><a href="b-machine/" target="_blank">מסך מלא</a></div>
    <p>כהה ומהונדס. המשפך (וריאציה 4): השוק שוקע אל הבולסאיי, ומתוכו עולות התגובות האמיתיות. כולל "נסו על החברה שלכם".</p></figcaption></figure>
  <figure><div class="frame"><iframe src="c-poster/" title="אתר C" loading="lazy"></iframe></div>
    <figcaption><div class="row"><div><span class="num">C</span><b>הפוסטר</b></div><a href="c-poster/" target="_blank">מסך מלא</a></div>
    <p>טיפוגרפיה ענקית והמספרים האמיתיים שלכם כוויזואל. מעברים חדים בין שחור, ציאן ונייר, ובולסאיי תלת-ממדי במקום ה-O של LEADBOUND.</p></figcaption></figure>
  <figure><div class="frame"><iframe src="d-range/" title="אתר D" loading="lazy"></iframe></div>
    <figcaption><div class="row"><div><span class="num">D</span><b>המטווח</b></div><a href="d-range/" target="_blank">מסך מלא</a></div>
    <p>בהיר, ומשלב את A ו-B. המשפך של B מודפס בדיו על הנייר של A, והמטרה התלת-ממדית שוכבת בתחתית שלו. בכל שלב נורה חץ, ובשיא התגובות האמיתיות עולות מתוך המטרה. פס השלבים הוא הלוגו עצמו.</p></figcaption></figure>
</main>
<script>
  // scale each 1440px-wide site preview to its frame
  const fit = () => document.querySelectorAll('.frame').forEach((f) => {
    const s = f.clientWidth / 1440; const i = f.querySelector('iframe');
    i.style.transform = `scale(${s})`; i.style.height = (f.clientHeight / s) + 'px';
  });
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
